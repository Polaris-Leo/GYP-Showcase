<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 外部图源（本站默认图所在的 i0/i2.hdslb.com 就是其中之一）按 Referer 做防盗链：
       带上本站 Referer 会被返回 403，图片全挂。这个 meta 不能删。
       必须放在任何 <link>/<img> 之前，否则先发出的子资源请求已经带上 Referer 了。 -->
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="鸽一品历史物品展厅，收录角色周边档案。">
  <link rel="icon" href="https://i2.hdslb.com/bfs/face/606736d259de6feb6a90c6205b7edc63e671302d.jpg" type="image/jpeg">
  <title>历史档案｜鸽一品</title>
  <style>
    :root {
      --bg: oklch(1 0 0);
      --surface: oklch(0.97 0 0);
      --fg: oklch(0.28 0 0);
      --muted: oklch(0.56 0 0);
      --border: oklch(0.9 0 0);
      --accent: oklch(0.53 0.12 257);
      --display: "Noto Serif SC", "Songti SC", STSong, serif;
      --body: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      --mono: ui-monospace, "Cascadia Mono", monospace;
      --ease: cubic-bezier(.22, .61, .36, 1);
      --page-x: clamp(20px, 3.3vw, 58px);
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); scroll-behavior: smooth; }
    body { margin: 0; color: var(--fg); background: var(--bg); font-family: var(--body); overflow-x: hidden; }
    a { color: inherit; text-decoration: none; }
    button { color: inherit; font: inherit; }
    h1, h2, h3, p { margin-top: 0; }
    figure { margin: 0; }

    .site-header { display: grid; min-height: 88px; grid-template-columns: 1fr auto 1fr; align-items: start; gap: 24px; padding: 24px var(--page-x) 0; }
    .brand { font-family: var(--mono); font-size: 14px; letter-spacing: .08em; line-height: 1.25; }
    .header-meta { color: var(--muted); font-size: 12px; line-height: 1.4; text-align: center; }
    .header-nav { display: flex; justify-content: flex-end; gap: 22px; font-size: 14px; }
    .header-nav a { border-bottom: 1px solid transparent; transition: border-color .25s var(--ease); }
    .header-nav a:hover, .header-nav a:focus-visible { border-color: var(--fg); outline: none; }

    main { padding: 0 var(--page-x); }
    .archive-hero { display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(260px, .82fr); align-items: center; gap: clamp(34px, 7vw, 130px); min-height: min(720px, 76vh); padding: clamp(20px, 2vw, 40px) 0 54px; border-bottom: 1px solid var(--border); }
    .kicker { margin: 0 0 18px; color: var(--muted); font-family: var(--mono); font-size: 11px; letter-spacing: .08em; }
    h1 { max-width: 7em; margin-bottom: 22px; font-family: var(--display); font-size: clamp(60px, 9vw, 144px); font-weight: 700; letter-spacing: -.08em; line-height: .86; }
    .archive-intro { max-width: 31em; margin-bottom: 0; font-size: 15px; line-height: 1.8; }
    .archive-index { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; border: 1px solid var(--border); background: var(--border); }
    .archive-index div { min-height: 120px; padding: 13px; background: var(--bg); }
    .archive-index strong { display: block; margin-bottom: 20px; font-family: var(--display); font-size: clamp(34px, 4vw, 58px); letter-spacing: -.07em; line-height: 1; }
    .archive-index span { color: var(--muted); font-family: var(--mono); font-size: 10px; line-height: 1.5; }

    .gallery-head { display: grid; grid-template-columns: minmax(0, 1fr) minmax(240px, .58fr); gap: 36px; padding: clamp(80px, 11vw, 150px) 0 42px; border-bottom: 1px solid var(--fg); }
    .gallery-head h2 { margin: 0; font-family: var(--display); font-size: clamp(42px, 6vw, 84px); letter-spacing: -.07em; line-height: .96; }
    .gallery-head p { align-self: end; max-width: 32em; margin: 0; color: var(--muted); font-size: 14px; line-height: 1.75; }
    .view-switcher { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding: 14px 0; border-bottom: 1px solid var(--border); }
    .view-switcher > span { color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .05em; }
    .view-controls { display: flex; gap: 6px; }
    .view-button { min-height: 44px; border: 1px solid transparent; background: var(--bg); padding: 0 12px; cursor: pointer; font-size: 12px; transition: border-color .25s var(--ease), background .25s var(--ease); }
    .view-button:hover { border-color: var(--border); background: var(--surface); }
    .view-button.is-active { border-color: var(--fg); }
    .view-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .archive-view[data-view="list"] .archive-grid { display: none; }
    .archive-view[data-view="grid"] .archive-list { display: none; }
    .archive-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border); border-left: 1px solid var(--border); }
    .archive-grid-card { min-height: 508px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); background: var(--bg); cursor: pointer; transition: background .3s var(--ease); }
    .archive-grid-card[hidden] { display: none; }
    .archive-grid-card:hover { background: var(--surface); }
    .archive-grid-card:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
    .grid-image { height: 340px; overflow: hidden; background: var(--surface); }
    .grid-image img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .7s var(--ease); }
    .archive-grid-card:hover .grid-image img { transform: scale(1.05); }
    .grid-copy { display: flex; min-height: 144px; flex-direction: column; padding: 14px; }
    .grid-meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .04em; }
    .grid-copy h3 { margin: auto 0 0; font-family: var(--display); font-size: clamp(23px, 2.2vw, 33px); letter-spacing: -.055em; line-height: 1; }
    .grid-copy p { margin: 8px 0 0; color: var(--muted); font-size: 11px; line-height: 1.55; }

    .archive-list { border-top: 0; }
    .archive-item { display: grid; grid-template-columns: minmax(110px, .46fr) minmax(240px, 1fr) minmax(220px, .82fr); gap: clamp(20px, 3.5vw, 60px); min-height: 330px; padding: 20px 0; border-bottom: 1px solid var(--border); }
    .archive-item[hidden] { display: none; }
    .archive-date { margin: 0; font-family: var(--mono); font-size: clamp(18px, 1.9vw, 27px); letter-spacing: -.06em; }
    .archive-image { position: relative; min-height: 290px; overflow: hidden; background: var(--surface); }
    .archive-image img { width: 100%; height: 100%; display: block; object-fit: cover; transition: transform .7s var(--ease); }
    .archive-item:hover .archive-image img { transform: scale(1.045); }
    .image-note { position: absolute; left: 12px; bottom: 12px; padding: 5px 7px; background: oklch(1 0 0 / .9); font-family: var(--mono); font-size: 10px; letter-spacing: .05em; }
    .archive-copy { display: flex; flex-direction: column; padding: 5px 0 4px; }
    .archive-status { margin: 0 0 auto; color: var(--muted); font-family: var(--mono); font-size: 10px; letter-spacing: .05em; }
    .archive-copy h3 { margin: 34px 0 12px; font-family: var(--display); font-size: clamp(30px, 3.2vw, 48px); letter-spacing: -.06em; line-height: 1; }
    .archive-copy p { max-width: 28em; margin-bottom: 0; font-size: 13px; line-height: 1.7; }
    .archive-meta { margin-top: auto; padding-top: 22px; color: var(--muted); font-family: var(--mono); font-size: 10px; line-height: 1.7; }

    dialog { width: min(920px, calc(100vw - 28px)); border: 0; padding: 0; background: var(--bg); color: var(--fg); box-shadow: 0 24px 80px oklch(0.28 0 0 / .24); }
    dialog::backdrop { background: oklch(0.28 0 0 / .38); backdrop-filter: blur(3px); }
    .dialog-inner { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(260px, .95fr); min-height: 510px; }
    .dialog-image { min-height: 510px; background: var(--surface); overflow: hidden; }
    .dialog-image img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .dialog-copy { display: flex; flex-direction: column; padding: 19px; }
    .close-button { align-self: flex-end; width: 44px; min-height: 44px; border: 1px solid var(--border); background: var(--bg); cursor: pointer; font-size: 20px; transition: background .25s var(--ease); }
    .close-button:hover { background: var(--surface); }
    .close-button:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .dialog-number { margin: auto 0 15px; font-family: var(--mono); font-size: 10px; color: var(--muted); }
    .dialog-copy h2 { margin-bottom: 14px; font-family: var(--display); font-size: clamp(42px, 5vw, 70px); letter-spacing: -.07em; line-height: .95; }
    .dialog-copy p { margin-bottom: 24px; font-size: 14px; line-height: 1.75; }
    .dialog-details { border-top: 1px solid var(--border); font-family: var(--mono); font-size: 11px; line-height: 1.8; padding-top: 12px; }

    .pagination { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 26px 0 clamp(90px, 12vw, 150px); border-bottom: 1px solid var(--fg); }
    .page-status { color: var(--muted); font-family: var(--mono); font-size: 11px; }
    .page-controls { display: flex; gap: 8px; }
    .page-button { min-width: 82px; min-height: 44px; border: 1px solid var(--fg); background: var(--bg); cursor: pointer; font-size: 12px; transition: background .25s var(--ease), color .25s var(--ease); }
    .page-button:hover:not(:disabled) { background: var(--fg); color: var(--bg); }
    .page-button:disabled { border-color: var(--border); color: var(--muted); cursor: not-allowed; }
    .page-button:focus-visible, .back-to-top:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

    .back-to-top { position: fixed; right: clamp(16px, 2vw, 30px); bottom: clamp(16px, 2vw, 30px); z-index: 10; width: 48px; min-height: 48px; border: 1px solid var(--fg); background: var(--bg); color: var(--fg); cursor: pointer; font-family: var(--mono); font-size: 11px; opacity: 0; pointer-events: none; transform: translateY(10px); transition: opacity .25s var(--ease), transform .25s var(--ease), background .25s var(--ease), color .25s var(--ease); }
    .back-to-top.is-visible { opacity: 1; pointer-events: auto; transform: translateY(0); }
    .back-to-top:hover { background: var(--fg); color: var(--bg); }

    footer { display: grid; grid-template-columns: 1fr auto 1fr; gap: 20px; padding: 16px var(--page-x) 24px; color: var(--muted); font-family: var(--mono); font-size: 10px; line-height: 1.4; }
    footer span:last-child { text-align: right; }

    @media (max-width: 760px) {
      .site-header { grid-template-columns: 1fr auto; }
      .header-meta { display: none; }
      .archive-hero, .gallery-head { grid-template-columns: 1fr; }
      .archive-hero { min-height: auto; padding-top: 85px; }
      h1 { max-width: none; font-size: clamp(52px, 14vw, 84px); letter-spacing: -.09em; }
      .archive-index { max-width: 440px; }
      .archive-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid-image { height: 285px; }
      .archive-item { grid-template-columns: minmax(94px, .4fr) minmax(0, 1fr); gap: 18px; min-height: 0; }
      .archive-image { grid-column: 2; min-height: 330px; }
      .archive-copy { grid-column: 2; min-height: 235px; }
      .dialog-inner { grid-template-columns: 1fr; }
      .dialog-image { min-height: 300px; max-height: 48vh; }
      .dialog-copy { min-height: 380px; }
      footer { grid-template-columns: 1fr; gap: 7px; }
      footer span:last-child { text-align: left; }
    }
    @media (max-width: 470px) {
      .header-nav { gap: 10px; }
      .archive-grid { grid-template-columns: 1fr; }
      .grid-image { height: 330px; }
      .archive-item { grid-template-columns: 1fr; gap: 14px; padding: 16px 0 22px; }
      .archive-image, .archive-copy { grid-column: auto; }
      .archive-image { min-height: 330px; }
      .archive-copy { min-height: 210px; }
      .archive-copy h3 { margin-top: 28px; }
      .pagination { align-items: flex-start; flex-direction: column; }
      .page-controls { width: 100%; }
      .page-button { flex: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="site-header" data-od-id="archive-header">
    <a href="index.html" class="brand" data-od-id="archive-brand-home">鸽一品<br>GEYIPIN</a>
    <p class="header-meta">角色周边历史档案<br>典藏记录 2025–2026</p>
    <nav class="header-nav" aria-label="页面导航" data-od-id="archive-navigation">
      <a href="index.html" data-od-id="nav-current-collection">当前展厅</a>
      <a href="#archive-list" data-od-id="nav-archive-list">历史展厅</a>
    </nav>
  </header>

  <main>
    <section class="archive-hero" data-od-id="archive-hero">
      <div>
        <p class="kicker">ARCHIVE / 历史展厅</p>
        <h1 data-od-id="archive-title">让每一件，<br>都有来处。</h1>
        <p class="archive-intro">这里收录曾经出现过的周边与纪念物，并持续整理名称、时间线、图片、规格与获得方式。</p>
      </div>
      <div class="archive-index" data-od-id="archive-summary">
        <div><strong>—</strong><span>历史档案条目<br>由后台内容更新</span></div>
        <div><strong>02</strong><span>分页浏览<br>每页三件物品</span></div>
      </div>
    </section>

    <section id="archive-list" data-od-id="archive-list-section">
      <div class="gallery-head">
        <h2 data-od-id="archive-list-heading">历史物品<br>展厅</h2>
        <p>每条档案均保留日期、物品类型与资料状态，并持续作为历年周边的索引入口，让旧物品不会从页面中消失。</p>
      </div>

      <div class="view-switcher" data-od-id="archive-view-switcher">
        <span>查看方式</span>
        <div class="view-controls" role="group" aria-label="切换历史档案查看方式">
          <button class="view-button is-active" type="button" data-view-target="list" aria-pressed="true" data-od-id="archive-list-view">列表</button>
          <button class="view-button" type="button" data-view-target="grid" aria-pressed="false" data-od-id="archive-grid-view">表格</button>
        </div>
      </div>

      <div class="archive-view" data-view="list" data-od-id="archive-view">
        <div class="archive-list" data-od-id="archive-list"></div>
        <div class="archive-grid" data-od-id="archive-grid"></div>
      </div>

      <div class="pagination" data-od-id="archive-pagination" hidden>
        <span class="page-status" aria-live="polite"></span>
        <div class="page-controls">
          <button class="page-button" type="button" data-page-action="previous" disabled data-od-id="archive-page-previous">上一页</button>
          <button class="page-button" type="button" data-page-action="next" data-od-id="archive-page-next">下一页</button>
        </div>
      </div>
    </section>
  </main>

  <dialog id="archive-dialog" aria-labelledby="dialog-title" data-od-id="archive-detail-dialog">
    <div class="dialog-inner">
      <div class="dialog-image"><img id="dialog-image" src="" alt=""></div>
      <div class="dialog-copy">
        <button class="close-button" type="button" aria-label="关闭说明" data-od-id="close-archive-dialog">×</button>
        <p class="dialog-number" id="dialog-number"></p>
        <h2 id="dialog-title"></h2>
        <p id="dialog-description"></p>
        <div class="dialog-details" id="dialog-details"></div>
      </div>
    </div>
  </dialog>

  <button class="back-to-top" type="button" aria-label="回到页面顶端" data-od-id="archive-back-to-top">顶部 ↑</button>

  <footer data-od-id="archive-footer">
    <span>© 2026 鸽一品</span>
    <span>历史物品展厅</span>
    <span>鸽一品历史物品档案</span>
  </footer>

  <script>
    const listItems = [...document.querySelectorAll('.archive-item')];
    const gridCards = [...document.querySelectorAll('[data-archive-grid-card]')];
    const view = document.querySelector('.archive-view');
    const viewButtons = [...document.querySelectorAll('[data-view-target]')];
    const previousButton = document.querySelector('[data-page-action="previous"]');
    const nextButton = document.querySelector('[data-page-action="next"]');
    const pageStatus = document.querySelector('.page-status');
    const pagination = document.querySelector('.pagination');
    const backToTop = document.querySelector('.back-to-top');
    const listPageSize = 3;
    const gridPageSize = 3;
    const archiveDialog = document.querySelector('#archive-dialog');
    const dialogImage = document.querySelector('#dialog-image');
    const dialogTitle = document.querySelector('#dialog-title');
    const dialogNumber = document.querySelector('#dialog-number');
    const dialogDescription = document.querySelector('#dialog-description');
    const dialogDetails = document.querySelector('#dialog-details');
    const closeDialog = document.querySelector('.close-button');
    const archiveDetails = {};
    let currentPage = 1;

    function getActivePageSize() {
      return view.dataset.view === 'grid' ? gridPageSize : listPageSize;
    }

    function getTotalPages() {
      return Math.max(1, Math.ceil(listItems.length / getActivePageSize()));
    }

    function renderPage(page, shouldAnchor = true) {
      const totalPages = getTotalPages();
      currentPage = Math.min(Math.max(page, 1), totalPages);
      if (pagination) pagination.hidden = listItems.length <= getActivePageSize();
      listItems.forEach((item, index) => { item.hidden = Math.floor(index / listPageSize) + 1 !== currentPage; });
      gridCards.forEach((card, index) => { card.hidden = Math.floor(index / gridPageSize) + 1 !== currentPage; });
      previousButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages;
      pageStatus.textContent = listItems.length ? `第 ${currentPage} 页，共 ${totalPages} 页` : '';
      if (shouldAnchor) window.location.hash = 'archive-list';
    }

    function setView(nextView) {
      view.dataset.view = nextView;
      viewButtons.forEach((button) => {
        const active = button.dataset.viewTarget === nextView;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-pressed', String(active));
      });
      renderPage(1, false);
    }

    function openDetails(itemKey) {
      const item = archiveDetails[itemKey];
      if (!item) return;
      dialogImage.src = item.image;
      dialogImage.alt = item.alt;
      dialogTitle.textContent = item.title;
      dialogNumber.textContent = item.number;
      dialogDescription.textContent = item.description;
      dialogDetails.innerHTML = item.details;
      archiveDialog.showModal();
      closeDialog.focus();
    }

    function wireGridCard(card) {
      card.addEventListener('click', () => openDetails(card.dataset.item));
      card.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          openDetails(card.dataset.item);
        }
      });
    }

    gridCards.forEach(wireGridCard);

    closeDialog.addEventListener('click', () => archiveDialog.close());
    archiveDialog.addEventListener('click', (event) => {
      const rect = archiveDialog.getBoundingClientRect();
      if (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom) archiveDialog.close();
    });

    viewButtons.forEach((button) => button.addEventListener('click', () => setView(button.dataset.viewTarget)));
    previousButton.addEventListener('click', () => renderPage(currentPage - 1));
    nextButton.addEventListener('click', () => renderPage(currentPage + 1));
    renderPage(1, false);

    function updateBackToTopVisibility() {
      backToTop.classList.toggle('is-visible', window.scrollY > window.innerHeight * .55);
    }
    window.addEventListener('scroll', updateBackToTopVisibility, { passive: true });
    updateBackToTopVisibility();
    backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));

    // 站点内容由 admin.html 编辑，存放在 EdgeOne KV，经 /api/content 读取；公开物品
    // 只在拿到后台配置后创建。
    async function fetchSiteContent() {
      try {
        const res = await fetch('/api/content', { cache: 'no-store' });
        if (res.ok) return await res.json();
      } catch (_) { /* 本地没有函数运行时，返回空内容 */ }
      return null;
    }
    (async function applySiteContent() {
      try {
        const data = await fetchSiteContent();
        if (!data) return;
        const overrides = (data && data.archive) || {};
        if (!Object.keys(overrides).length) return;
        const get = (obj, path) => {
          const parts = path.split('.');
          let n = obj;
          for (let i = 0; i < parts.length; i++) {
            if (n == null || typeof n !== 'object') return undefined;
            n = n[parts[i]];
          }
          return n;
        };
        // 后台字段最终会进 innerHTML（dialog-details），必须先转义再拼
        const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const setText = (id, value) => {
          const el = document.querySelector(`[data-od-id="${id}"]`);
          if (el && value != null && typeof value === 'string') {
            el.innerHTML = value.split('\n').map(esc).join('<br>');
          }
        };

        setText('archive-brand-home', get(overrides, 'archive-brand-home'));
        setText('nav-current-collection', get(overrides, 'nav-current-collection'));
        setText('nav-archive-list', get(overrides, 'nav-archive-list'));
        setText('archive-title', get(overrides, 'archive-title'));

        const introEl = document.querySelector('.archive-intro');
        const introVal = get(overrides, 'archive-intro');
        if (introEl && introVal != null) introEl.textContent = introVal;

        // 历史条目：以后台的 itemOrder 为准，列表视图与表格视图同步新建／更新／删除／重排
        const pad2 = (n) => String(n).padStart(2, '0');
        const listHost = document.querySelector('.archive-list');
        const gridHost = document.querySelector('.archive-grid');
        let order = get(overrides, 'itemOrder');
        if (!Array.isArray(order)) {
          order = [];
        }
        const archiveSummaryCount = document.querySelector('[data-od-id="archive-summary"] strong');
        if (archiveSummaryCount) archiveSummaryCount.textContent = pad2(order.length);

        const dateToDot = (value) => String(value == null ? '' : value).split('\n').join('.');

        function buildListItem(itemKey) {
          const item = document.createElement('article');
          item.className = 'archive-item';
          item.dataset.page = '1';
          item.dataset.item = itemKey;
          item.dataset.odId = 'archive-item-' + itemKey;
          item.innerHTML =
            '<p class="archive-date"></p>' +
            '<figure class="archive-image"><img src="https://i0.hdslb.com/bfs/garb/open/c2bb646b6369aad51a004d673e3287e912d7756a.png" alt="" loading="lazy"><span class="image-note">历史档案</span></figure>' +
            '<div class="archive-copy"><p class="archive-status"></p><h3></h3><p></p><p class="archive-meta"></p></div>';
          return item;
        }

        function buildGridCard(itemKey) {
          const card = document.createElement('article');
          card.className = 'archive-grid-card';
          card.dataset.archiveGridCard = '1';
          card.dataset.item = itemKey;
          card.setAttribute('role', 'button');
          card.setAttribute('tabindex', '0');
          card.dataset.odId = 'archive-grid-card-' + itemKey;
          card.innerHTML =
            '<div class="grid-image"><img src="https://i0.hdslb.com/bfs/garb/open/c2bb646b6369aad51a004d673e3287e912d7756a.png" alt="" loading="lazy"></div>' +
            '<div class="grid-copy"><div class="grid-meta"><span></span><span></span></div><h3></h3><p></p></div>';
          return card;
        }

        if (listHost && gridHost) {
          const existingList = new Map();
          listHost.querySelectorAll('.archive-item').forEach((el) => existingList.set(el.dataset.item, el));
          const existingGrid = new Map();
          gridHost.querySelectorAll('[data-archive-grid-card]').forEach((el) => existingGrid.set(el.dataset.item, el));
          const keptList = [];
          const keptGrid = [];

          order.forEach((key, index) => {
            const o = get(overrides, key) || {};
            const itemKey = String(key).replace(/^item-/, '');
            const status = 'ARCHIVE ' + pad2(index + 1);
            // 「资料状态」「获得方式」来自后台字段；旧数据缺字段（或留空）时落到兜底值。
            // 前者同时喂给列表状态行、表格角标和弹窗，后者喂给列表 meta 和弹窗。
            const trimVal = (v) => (v == null ? '' : String(v).trim());
            const stateVal = trimVal(o.state) || '档案收录';
            const gainVal = trimVal(o.gain) || '以官方信息为准';

            let listItem = existingList.get(itemKey);
            const listIsNew = !listItem;
            if (listIsNew) { listItem = buildListItem(itemKey); listHost.appendChild(listItem); }

            let gridCard = existingGrid.get(itemKey);
            const gridIsNew = !gridCard;
            if (gridIsNew) {
              gridCard = buildGridCard(itemKey);
              gridHost.appendChild(gridCard);
              wireGridCard(gridCard);
            }

            // ── 列表视图 ──
            const statusEl = listItem.querySelector('.archive-status');
            if (statusEl) statusEl.textContent = status + ' / ' + stateVal;
            if (o.title != null) { const h = listItem.querySelector('h3'); if (h) h.textContent = o.title; }
            if (o.date != null && typeof o.date === 'string') {
              const d = listItem.querySelector('.archive-date');
              if (d) {
                d.textContent = '';
                o.date.split('\n').forEach((line, i) => {
                  if (i) d.appendChild(document.createElement('br'));
                  d.appendChild(document.createTextNode(line));
                });
              }
            }
            if (o.desc != null) {
              const p = listItem.querySelector('.archive-copy > p:not(.archive-status):not(.archive-meta)');
              if (p) p.textContent = o.desc;
            }
            const listMeta = listItem.querySelector('.archive-meta');
            if (listMeta) {
              listMeta.textContent = '';
              const cat = o.category != null ? String(o.category) : '';
              if (cat) {
                listMeta.appendChild(document.createTextNode('类别：' + cat));
                listMeta.appendChild(document.createElement('br'));
              }
              listMeta.appendChild(document.createTextNode('获得方式：' + gainVal));
            }
            const listImg = listItem.querySelector('.archive-image img');
            if (listImg) {
              if (o.image) listImg.src = o.image;
              if (listIsNew && o.title) listImg.alt = '历史物品：' + o.title;
            }

            // ── 表格视图 ──
            const gridSpans = gridCard.querySelectorAll('.grid-meta span');
            if (gridSpans[0] && o.date != null) gridSpans[0].textContent = dateToDot(o.date);
            if (gridSpans[1] && o.category != null) gridSpans[1].textContent = o.category;
            if (o.title != null) {
              const h = gridCard.querySelector('h3');
              if (h) h.textContent = o.title;
              gridCard.setAttribute('aria-label', '查看' + o.title + '物品说明');
            }
            const gridNote = gridCard.querySelector('.grid-copy > p');
            if (gridNote) gridNote.textContent = status + ' ／ ' + stateVal;
            const gridImg = gridCard.querySelector('.grid-image img');
            if (gridImg) {
              if (o.image) gridImg.src = o.image;
              if (gridIsNew && o.title) gridImg.alt = o.title + '图片';
            }

            // ── 弹窗数据 ──
            const entry = archiveDetails[itemKey] || (archiveDetails[itemKey] = {
              number: '', title: '', image: 'https://i0.hdslb.com/bfs/garb/open/c2bb646b6369aad51a004d673e3287e912d7756a.png', alt: '', description: '', details: ''
            });
            entry.number = status + ' / ' + dateToDot(o.date != null ? o.date : '');
            if (o.title != null) { entry.title = o.title; if (gridIsNew) entry.alt = o.title + '图片'; }
            if (o.desc != null) entry.description = o.desc;
            if (o.image) entry.image = o.image;
            const cat = o.category != null ? String(o.category) : '';
            entry.details = '类别：' + esc(cat) + '<br>资料状态：' + esc(stateVal) + '<br>获得方式：' + esc(gainVal);

            keptList.push(listItem);
            keptGrid.push(gridCard);
          });

          // 顺序数组里没有的＝已在后台删除
          const keptListSet = new Set(keptList);
          existingList.forEach((el) => { if (!keptListSet.has(el)) el.remove(); });
          const keptGridSet = new Set(keptGrid);
          existingGrid.forEach((el) => { if (!keptGridSet.has(el)) el.remove(); });
          // 按顺序重排
          keptList.forEach((el) => listHost.appendChild(el));
          keptGrid.forEach((el) => gridHost.appendChild(el));

          // 条目数变了，分页要按新总数重算
          listItems.length = 0;
          listItems.push(...listHost.querySelectorAll('.archive-item'));
          gridCards.length = 0;
          gridCards.push(...gridHost.querySelectorAll('[data-archive-grid-card]'));
          renderPage(1, false);
        }

      } catch (e) {
        console.warn('站点内容加载失败，已使用默认内容：', e);
      }
    })();
  </script>
</body>
</html>
